{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-screen">
  <div class="auth-card">
   <img src="{{ url_for('static', filename='cag-logo.png') }}" alt="CAG Logo" class="auth-logo">
    <h2>Create Your Account</h2>
    <p class="subtitle">A 6-digit OTP will be sent to your email.</p>
    <form method="POST">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" minlength="6" required>
      <label for="confirm_password">Confirm Password</label>
      <input type="password" id="confirm_password" name="confirm_password" minlength="6" required>
      <button type="submit" class="btn btn-primary btn-block">Register &amp; Send OTP</button>
    </form>
    <p class="auth-footer">Already have an account? <a href="{{ url_for('user_login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
