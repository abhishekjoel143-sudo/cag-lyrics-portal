{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<div class="auth-screen">
  <div class="auth-card auth-card-admin">
   <img src="{{ url_for('static', filename='cag-logo.png') }}" alt="CAG Logo" class="auth-logo">
    <p class="subtitle">Authorized personnel only.</p>
    <form method="POST">
      <label for="admin_id">Admin ID</label>
      <input type="text" id="admin_id" name="admin_id" required autofocus>

      <label for="admin_password">Password</label>
      <input type="password" id="admin_password" name="admin_password" required>

      <button type="submit" class="btn btn-admin btn-block">Log In as Admin</button>
    </form>
    <p class="auth-footer"><a href="{{ url_for('welcome') }}">&larr; Back to home</a></p>
  </div>
</div>
{% endblock %}
